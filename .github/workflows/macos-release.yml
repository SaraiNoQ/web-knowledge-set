name: macOS release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-production
    permissions:
      contents: write
    env:
      APPROVED_RC_SHA: ${{ vars.APPROVED_RC_SHA }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Prepare Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Validate release source
        run: node scripts/validate-macos-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm notices:check
      - name: Prepare signing keychain
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN=$(mktemp -d)/release.keychain-db
          CERTIFICATE=$(mktemp)
          API_KEY=$(mktemp)
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          {
            echo "keychain=$KEYCHAIN"
            echo "certificate=$CERTIFICATE"
            echo "api_key=$API_KEY"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY"
          chmod 600 "$CERTIFICATE" "$API_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
      - name: Build signed application and DMG
        env:
          ZHIYE_SIGN_RELEASE: "1"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.api_key }}
        run: |
          pnpm desktop:prepare
          scripts/macos-sign-nested.sh
          pnpm tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles app,dmg
      - name: Notarize and staple final DMG
        id: artifact
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.api_key }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --output-format json > notary-result.json
          node -e 'const r=require("./notary-result.json"); if(r.status!=="Accepted") throw Error(`Notary status: ${r.status}`)'
          SUBMISSION_ID=$(node -p 'require("./notary-result.json").id')
          xcrun notarytool log "$SUBMISSION_ID" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" notary-log.json
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p verified-artifact
          ditto "$APP" verified-artifact/Zhiye.app
          hdiutil detach "$MOUNT"
          trap - EXIT
          codesign --verify --deep --strict --verbose=2 verified-artifact/Zhiye.app
          spctl --assess --type execute --verbose=2 verified-artifact/Zhiye.app
          codesign -d --entitlements :- verified-artifact/Zhiye.app/Contents/MacOS/node 2>/dev/null \
            | plutil -extract com.apple.security.cs.allow-jit raw -o - - \
            | grep -Fx true
          echo "app=verified-artifact/Zhiye.app" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
      - name: Exercise signed packaged application
        run: |
          scripts/macos-desktop-smoke.sh "${{ steps.artifact.outputs.app }}"
          node scripts/macos-browser-security-smoke.mjs "${{ steps.artifact.outputs.app }}/Contents/Resources/runtime"
      - name: Build release evidence
        env:
          APP_PATH: ${{ steps.artifact.outputs.app }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}
          cp "$DMG_PATH" "release-assets/Zhiye_${VERSION}_aarch64.dmg"
          cp THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt release-assets/
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_darwin_arm64.tar.gz
          echo "4f37f4c7fefce0a68e4cf71ba3f5f9829a99e65d89b29f7ee41b8c2c10ea8c59  /tmp/syft.tar.gz" | shasum -a 256 --check
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          /tmp/syft scan dir:. --output cyclonedx-json=release-assets/source.cdx.json
          /tmp/syft scan "dir:$APP_PATH" --output cyclonedx-json=release-assets/macos-app.cdx.json
          cp notary-result.json notary-log.json release-assets/
          (cd release-assets && shasum -a 256 Zhiye_* THIRD_PARTY_* *.cdx.json notary-*.json > SHA256SUMS)
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes release-assets/*
          gh release download "$GITHUB_REF_NAME" --dir downloaded-assets
          (cd downloaded-assets && shasum -a 256 -c SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" 2>/dev/null || true
          rm -f "${{ steps.signing.outputs.certificate }}" "${{ steps.signing.outputs.api_key }}"
