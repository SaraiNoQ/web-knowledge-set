name: macOS DMG build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare desktop runtime
        run: pnpm desktop:prepare
      - name: Build application
        run: pnpm tauri build --ci --no-sign --config '{"bundle":{"macOS":{"infoPlist":"Info.rc.plist","bundleVersion":"10001"}}}' --bundles app
      - name: Ad-hoc sign application and build DMG
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          while IFS= read -r -d '' PATHNAME; do
            if [[ -f "$PATHNAME" ]] && file -b "$PATHNAME" | grep -q Mach-O; then
              codesign --force --sign - --entitlements src-tauri/entitlements.chromium.plist "$PATHNAME"
            elif [[ -d "$PATHNAME" && "$PATHNAME" =~ \.(app|framework|xpc)$ ]]; then
              codesign --force --sign - "$PATHNAME"
            fi
          done < <(find "$APP/Contents" -depth -print0)
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dmg-root src-tauri/target/release/bundle/dmg
          ditto "$APP" "dmg-root/织页.app"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "织页" -srcfolder dmg-root -ov -format UDZO \
            src-tauri/target/release/bundle/dmg/织页_1.0.1_aarch64.dmg
      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zhiye-dmg-${{ inputs.source_sha }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
