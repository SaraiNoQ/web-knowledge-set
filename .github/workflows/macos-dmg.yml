name: Publish accepted macOS 1.0.7

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1a6eb0500c07d14da40b289bdd66e0e3d1f74934
          fetch-depth: 0
          persist-credentials: false
      - name: Bind packaging to the accepted source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1a6eb0500c07d14da40b289bdd66e0e3d1f74934
          test "$(gh run view 40007202146 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 40007202146 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = 7632c92527390bbbbfcf5319018c7f0afc28b45a
          git diff --exit-code 7632c92527390bbbbfcf5319018c7f0afc28b45a HEAD
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Prepare locked build tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
          pnpm install --frozen-lockfile
      - name: Build accepted release application
        run: pnpm tauri build --ci --no-sign --bundles app --config '{"bundle":{"macOS":{"infoPlist":"Info.rc.plist","bundleVersion":"10007"}}}'
      - name: Sign and package
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/织页.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 1.0.7
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = io.github.sarainoq.zhiye
          while IFS= read -r -d '' PATHNAME; do
            if [[ -f "$PATHNAME" ]] && file -b "$PATHNAME" | grep -q Mach-O; then
              codesign --force --sign - --entitlements src-tauri/entitlements.chromium.plist "$PATHNAME"
            elif [[ -d "$PATHNAME" && "$PATHNAME" =~ \.(app|framework|xpc)$ ]]; then
              codesign --force --sign - "$PATHNAME"
            fi
          done < <(find "$APP/Contents" -depth -print0)
          codesign --force --sign - "$APP"
          mkdir release-assets
          bash scripts/package-macos-installer.sh "$APP" "$PWD/release-assets/Zhiye_1.0.7_aarch64.pkg"
          cp docs/RELEASE_NOTES_1.0.7.md release-assets/RELEASE_NOTES.md
          printf '\nRust 审计无阻断漏洞，仍有四条停止维护及一条 glib 不健全性警告。\n' >> release-assets/RELEASE_NOTES.md
          printf '%s\n' '{"version":"1.0.7","source":"1a6eb0500c07d14da40b289bdd66e0e3d1f74934","acceptance":"https://github.com/SaraiNoQ/web-knowledge-set/actions/runs/40007202146","macos":"passed","linux":"owner-approved skip","signing":"ad-hoc, not Apple-notarized"}' > release-assets/verification.json
          (cd release-assets && shasum -a 256 *.pkg RELEASE_NOTES.md verification.json > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accepted-macos-1.0.7-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: accepted-macos-1.0.7-${{ github.run_id }}
          path: release-assets
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS)
          test "$(gh release view v1.0.7 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload v1.0.7 --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
          gh release view v1.0.7 --repo "$GITHUB_REPOSITORY" --json assets > remote-assets.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          assets={a['name']:a for a in json.load(open('remote-assets.json'))['assets']}
          for path in Path('release-assets').iterdir():
              asset=assets[path.name]
              assert asset['state']=='uploaded' and asset['size']==path.stat().st_size
              assert asset['digest']=='sha256:'+hashlib.file_digest(path.open('rb'),'sha256').hexdigest()
          PY
          gh release edit v1.0.7 --repo "$GITHUB_REPOSITORY" --draft=false --latest --target 1a6eb0500c07d14da40b289bdd66e0e3d1f74934 --title '织页 1.0.7（Apple Silicon）' --notes-file release-assets/RELEASE_NOTES.md
          test "$(gh release view v1.0.7 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v1.0.7" --jq .sha)" = 1a6eb0500c07d14da40b289bdd66e0e3d1f74934
