name: macOS desktop smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "agent/**"]

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned desktop app
        run: pnpm tauri build --debug --bundles app
      - name: Exercise isolated macOS Keychain entry
        run: cargo test --manifest-path src-tauri/Cargo.toml keychain::tests
      - name: Exercise macOS URL and file entry points
        run: scripts/macos-desktop-smoke.sh
