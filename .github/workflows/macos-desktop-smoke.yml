name: macOS desktop smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "agent/**"]

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Prepare Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: |
          pnpm audit --registry=https://registry.npmjs.org --audit-level high
          pnpm audit --registry=https://registry.npmjs.org --prod --audit-level high
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cd src-tauri
          cargo audit
      - name: Build unsigned desktop app
        run: pnpm tauri build --debug --bundles app
      - name: Exercise isolated macOS Keychain entry
        run: cargo test --manifest-path src-tauri/Cargo.toml keychain::tests
      - name: Exercise macOS URL and file entry points
        run: scripts/macos-desktop-smoke.sh
