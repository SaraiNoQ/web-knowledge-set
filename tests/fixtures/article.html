      <h1>本地知识库实践</h1>
      <p>一个可靠的本地知识库应当先保留来源，再将网页正文转换为可编辑的 Markdown。</p>
      <p>数据库保存用户编辑的内容，原始网页快照则用于未来重新提取，两者不应互相覆盖。</p>

      <pre><code class="language-js">const source = "https://example.com";</code></pre>
