[package]
name = "zhiye"
version = "0.4.0"
description = "A local-first web knowledge library"
authors = ["Zhiye contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "zhiye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
